<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Whatsit Swap</title>
<meta name="description" content="A trading table for weird, random, one-of-a-kind things.">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%9D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:ital,wght@0,400;0,700;0,900;1,400&display=swap">
<style>
:root{
  --ground:#F2EDF9; --surface:#FFFFFF; --felt:#E7DCF5; --sunk:#EDE4F7;
  --ink:#2A1B3D; --ink-2:#6E5C84; --line:#DACBEB;
  --keep:#2E7BE0; --keep-soft:#DAEAFB;
  --done:#0FAF7E; --done-soft:#D9F5EC;
  --no:#F0455F;
  --gold:#F2A81C; --pop:#7A3BE0;
  --shadow:0 2px 0 #DACBEB, 0 5px 12px rgba(42,27,61,.10);
  --r-common:#8E7EA9; --r-rare:#2E8FE0; --r-epic:#9B44E0; --r-legend:#F2A81C; --r-oneof:#F0455F;
  --t-cursed:#EDE3FB; --t-shiny:#FDF2D6; --t-squishy:#FDE4EE; --t-gross:#E1F4DE; --t-ancient:#F6EBDA; --t-box:#E8E3F2;
  --c-cursed:#8B3FE8; --c-shiny:#E0980D; --c-gross:#3F9A2E; --c-ancient:#8A6A3E; --c-box:#6E5C84;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#160F26; --surface:#241A3A; --felt:#1E1533; --sunk:#2C2148;
    --ink:#F7F1FF; --ink-2:#B0A0CA; --line:#3D2E5C;
    --keep:#3E90F5; --keep-soft:#12294A;
    --done:#19C994; --done-soft:#123A30;
    --no:#FF5C73;
    --gold:#FFC53D; --pop:#B487FF;
    --shadow:0 2px 0 #3D2E5C, 0 5px 14px rgba(0,0,0,.4);
    --r-common:#9C8CB8; --r-rare:#5AB0F5; --r-epic:#C07CFF; --r-legend:#FFC53D; --r-oneof:#FF6B80;
    --t-cursed:#2B2049; --t-shiny:#3A2F12; --t-squishy:#3B2031; --t-gross:#153318; --t-ancient:#33281A; --t-box:#2A2340;
    --c-cursed:#C08CFF; --c-shiny:#FFC53D; --c-gross:#6FD45C; --c-ancient:#C9A472; --c-box:#B0A0CA;
  }
}
:root[data-theme="dark"]{
  --ground:#160F26; --surface:#241A3A; --felt:#1E1533; --sunk:#2C2148;
  --ink:#F7F1FF; --ink-2:#B0A0CA; --line:#3D2E5C;
  --keep:#3E90F5; --keep-soft:#12294A;
  --done:#19C994; --done-soft:#123A30;
  --no:#FF5C73;
  --gold:#FFC53D; --pop:#B487FF;
  --shadow:0 2px 0 #3D2E5C, 0 5px 14px rgba(0,0,0,.4);
  --r-common:#9C8CB8; --r-rare:#5AB0F5; --r-epic:#C07CFF; --r-legend:#FFC53D; --r-oneof:#FF6B80;
  --t-cursed:#2B2049; --t-shiny:#3A2F12; --t-squishy:#3B2031; --t-gross:#153318; --t-ancient:#33281A; --t-box:#2A2340;
  --c-cursed:#C08CFF; --c-shiny:#FFC53D; --c-gross:#6FD45C; --c-ancient:#C9A472; --c-box:#B0A0CA;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Nunito, ui-rounded, "Segoe UI", system-ui, sans-serif;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}

.app{
  height:100vh; height:100dvh; max-width:560px; margin:0 auto;
  padding:5px 7px calc(5px + env(safe-area-inset-bottom));
  padding-top:calc(5px + env(safe-area-inset-top));
  display:flex; flex-direction:column; gap:5px; overflow:hidden;
}

/* ---------- top bar ---------- */
.bar{display:flex; align-items:center; gap:6px; flex:none}
.logo{
  font-family:"Bagel Fat One", Nunito, cursive; font-size:clamp(18px,5.2vw,25px);
  line-height:1.1; margin:0; font-weight:400; white-space:nowrap;
  background:linear-gradient(100deg,var(--pop),var(--no) 60%,var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.bar .spacer{flex:1}
.icon-btn{
  border:2px solid var(--line); background:var(--surface); color:var(--ink);
  width:29px; height:29px; border-radius:9px; font-size:12px; cursor:pointer;
  display:grid; place-items:center; box-shadow:var(--shadow); flex:none; padding:0;
}
.icon-btn:active{transform:translateY(1px)}
button:focus-visible, input:focus-visible{outline:3px solid var(--pop); outline-offset:2px}

/* ---------- trader panel ---------- */
.panel{
  background:var(--surface); border:2px solid var(--line); border-radius:14px;
  padding:5px 7px 6px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:4px; flex:1 1 0; min-height:74px;
}
.phead{display:flex; align-items:center; gap:5px; flex:none}
.who{
  font-weight:900; font-size:13.5px; border:none; background:transparent; color:var(--ink);
  font-family:inherit; width:8ch; padding:2px 4px; border-radius:6px; min-width:0;
}
.who:hover{background:var(--sunk)}
.avatar{
  width:25px; height:25px; border-radius:8px; display:grid; place-items:center; font-size:14px;
  background:var(--sunk); flex:none; border:none; cursor:pointer; padding:0;
}
.count{font-size:9px; font-weight:900; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap}
.phead .spacer{flex:1}

/* bin chips - these replaced the old Find stuff button */
.bins{
  display:flex; gap:5px; flex:none; overflow-x:auto; padding-bottom:1px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.bins::-webkit-scrollbar{display:none}
.bin{
  flex:none; display:flex; align-items:center; gap:3px; cursor:pointer; font-family:inherit;
  border:2px solid var(--line); background:var(--sunk); color:var(--ink);
  border-radius:999px; padding:3px 8px 3px 6px; font-size:9.5px; font-weight:900; white-space:nowrap;
}
.bin .bemo{font-size:12px; line-height:1}
.bin:active{transform:translateY(1px)}

.stash{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:5px; align-content:start;
  flex:1 1 0; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px; margin:0 -2px;
}
.empty{
  grid-column:1/-1; text-align:center; color:var(--ink-2); font-size:11px; font-style:italic;
  padding:8px 6px; margin:0; align-self:center;
}

/* ---------- the picture ---------- */
.pic{
  position:relative; width:100%; aspect-ratio:5/4; border-radius:8px; overflow:visible;
  display:grid; place-items:center; background:var(--t-box);
}
.pic .glyph{font-size:26px; line-height:1; filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.pic .d{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.pic .d path{fill:none; stroke-linecap:round; stroke-linejoin:round}

.pic.cursed{background:var(--t-cursed)}
.pic.cursed .d path{stroke:var(--c-cursed); stroke-width:5; animation:wig 1.6s ease-in-out infinite}
.pic.cursed .glyph{animation:hover 2.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

.pic.shiny{background:var(--t-shiny)}
.pic .spark{position:absolute; color:var(--c-shiny); font-size:11px; font-style:normal; animation:twink 1.5s ease-in-out infinite}
.pic .spark:nth-child(2){top:8%; left:10%}
.pic .spark:nth-child(3){top:14%; right:9%; animation-delay:.5s; font-size:8px}
.pic .spark:nth-child(4){bottom:10%; right:16%; animation-delay:1s; font-size:9px}
@keyframes twink{0%,100%{opacity:.25; transform:scale(.7)}50%{opacity:1; transform:scale(1.15)}}

.pic.squishy{background:var(--t-squishy)}
.pic.squishy .glyph{animation:squish 1.3s ease-in-out infinite}
@keyframes squish{0%,100%{transform:scale(1,1)}45%{transform:scale(1.14,.84)}70%{transform:scale(.93,1.08)}}

.pic.gross{background:var(--t-gross)}
.pic.gross .d path{stroke:var(--c-gross); stroke-width:6; animation:drip 2.1s ease-in infinite}
.pic.gross .d path:nth-child(2){animation-delay:.7s}
.pic.gross .d path:nth-child(3){animation-delay:1.4s}
@keyframes drip{0%{opacity:0; transform:translateY(-5px)}30%{opacity:1}100%{opacity:0; transform:translateY(9px)}}

.pic.ancient{background:var(--t-ancient)}
.pic.ancient .glyph{filter:sepia(.7) contrast(.92) drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.pic.ancient .d path{stroke:var(--c-ancient); stroke-width:1.6; opacity:.8}

.pic.box{background:var(--t-box)}
.pic.box .tape{
  position:absolute; left:6%; right:6%; top:50%; height:5px; margin-top:-2.5px;
  background:var(--c-box); opacity:.42; border-radius:3px;
}
.pic.box .tape.v{left:50%; right:auto; top:8%; bottom:8%; height:auto; width:5px; margin:0 0 0 -2.5px}
.pic.box .seal{
  position:absolute; right:-3px; top:-4px; font-size:12px; font-style:normal;
  background:var(--surface); border-radius:50%; padding:1px 2px; line-height:1;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}

/* ---------- cards ---------- */
.cardwrap{position:relative; min-width:0; display:flex}
.card{
  position:relative; width:100%; text-align:left; cursor:pointer; font-family:inherit; color:var(--ink);
  background:var(--surface); border:2px solid var(--line); border-top-width:4px; border-radius:10px;
  padding:4px 4px 5px; display:flex; flex-direction:column; gap:2px; min-width:0;
  animation:pop .2s cubic-bezier(.2,1.5,.5,1) both;
}
.card:active{transform:translateY(1px)}
.card .nm{font-weight:900; font-size:9px; line-height:1.15; overflow-wrap:anywhere}
.card .qk{font-size:8px; font-style:italic; color:var(--ink-2); line-height:1.2}
.card .pips{font-size:7.5px; letter-spacing:.08em; font-weight:900}
.card[data-r="common"]{border-top-color:var(--r-common)} .card[data-r="common"] .pips{color:var(--r-common)}
.card[data-r="rare"]{border-top-color:var(--r-rare)} .card[data-r="rare"] .pips{color:var(--r-rare)}
.card[data-r="epic"]{border-top-color:var(--r-epic)} .card[data-r="epic"] .pips{color:var(--r-epic)}
.card[data-r="legendary"]{border-top-color:var(--r-legend)} .card[data-r="legendary"] .pips{color:var(--r-legend)}
.card[data-r="one-of-a-kind"]{border-top-color:var(--r-oneof)} .card[data-r="one-of-a-kind"] .pips{color:var(--r-oneof)}
.card .sn{
  position:absolute; bottom:4px; right:4px; font-size:6.5px; font-weight:900; color:var(--ink-2);
  opacity:.65; font-variant-numeric:tabular-nums;
}
@keyframes pop{from{opacity:0; transform:scale(.82)} to{opacity:1; transform:none}}

.badge{
  position:absolute; top:2px; left:2px; z-index:2; width:22px; height:22px; border-radius:50%;
  border:2px solid var(--surface); color:#FFFFFF; font-size:12px; font-weight:900; font-family:inherit;
  display:grid; place-items:center; cursor:pointer; padding:0; line-height:1;
  box-shadow:0 2px 5px rgba(0,0,0,.3);
}
.badge.pack{background:var(--pop)}
.badge.open{background:var(--gold); color:#3A2A00; animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* ---------- the table: buttons outside, the stuff in the middle ---------- */
.table{
  flex:none; background:var(--felt); border:3px dashed var(--line); border-radius:16px; padding:6px;
  display:flex; flex-direction:column; gap:5px;
  background-image:radial-gradient(var(--line) 1px, transparent 1.4px); background-size:15px 15px;
}
.slots{
  display:grid; grid-auto-flow:column; grid-auto-columns:58px; gap:5px; justify-content:start;
  height:86px; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  background:var(--surface); border-radius:10px; padding:5px;
}
/* on the table the picture gives up space so the stars are never cut off */
.slots .card{height:100%; overflow:hidden}
.slots .pic{flex:1 1 auto; min-height:14px; aspect-ratio:auto}
.slots .nm{flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.slots .pips{flex:none; font-size:9px; letter-spacing:.06em}
.slots::-webkit-scrollbar{height:0}
.slots .empty{
  grid-column:1/-1; width:100%; font-size:10.5px; padding:0; align-self:center;
  grid-auto-columns:auto; white-space:nowrap;
}
.slots.wide{grid-auto-flow:row; grid-template-columns:1fr}
.mid{display:flex; align-items:center; gap:7px; padding:0 2px}
.mid .rule{flex:1; height:2px; border-radius:2px; background:var(--line)}
.mid .arrows{font-size:11px; font-weight:900; color:var(--ink-2)}

/* ---------- the three circle buttons ---------- */
.acts{display:flex; justify-content:center; gap:13px; flex:none}
.act{
  background:none; border:none; padding:0; cursor:pointer; font-family:inherit;
  display:flex; flex-direction:column; align-items:center; gap:2px; width:62px;
}
.dot{
  width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  font-size:23px; font-weight:900; color:#FFFFFF; line-height:1;
  border:3px solid rgba(255,255,255,.55); transition:transform .12s, box-shadow .12s;
}
.act .lbl{
  font-size:8.5px; font-weight:900; text-transform:uppercase; letter-spacing:.02em;
  color:var(--ink-2); text-align:center; line-height:1.1;
}
.act:active .dot{transform:translateY(2px) scale(.95)}
.act.keep .dot{background:var(--keep); box-shadow:0 3px 0 rgba(0,0,0,.16), 0 0 0 3px var(--keep-soft)}
.act.done .dot{background:var(--done); box-shadow:0 3px 0 rgba(0,0,0,.16), 0 0 0 3px var(--done-soft)}
.act.no .dot{background:var(--no); box-shadow:0 3px 0 rgba(0,0,0,.16), 0 0 0 3px rgba(240,69,95,.18)}
.act.done[aria-pressed="true"] .dot{
  box-shadow:0 0 0 4px var(--done), 0 0 14px rgba(15,175,126,.75); animation:beat 1.1s ease-in-out infinite;
}
.act.done[aria-pressed="true"] .lbl{color:var(--done)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.act:disabled{opacity:.36; cursor:not-allowed}
.act:focus-visible .dot{outline:3px solid var(--pop); outline-offset:3px}

.status{
  flex:none; text-align:center; font-weight:900; font-size:11px; min-height:14px; color:var(--ink-2);
  padding:0 4px; margin:0; text-wrap:balance; line-height:1.25;
}
.status.keep{color:var(--keep)} .status.done{color:var(--done)} .status.stop{color:var(--no)}
.status.shake{animation:shake .34s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

canvas#fx{position:fixed; inset:0; pointer-events:none; z-index:80}
.flash{animation:flash .6s}
@keyframes flash{0%{background-color:var(--done-soft)}100%{background-color:var(--felt)}}

/* ---------- sheets ---------- */
.veil[hidden]{display:none}
.veil{
  position:fixed; inset:0; z-index:60; background:rgba(20,10,35,.6);
  display:grid; place-items:center; padding:14px;
}
.sheet{
  background:var(--surface); color:var(--ink); border:3px solid var(--line); border-radius:18px;
  padding:13px; max-width:360px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,.4);
  max-height:88vh; overflow-y:auto; animation:rise .22s cubic-bezier(.2,1.3,.5,1) both;
}
@keyframes rise{from{opacity:0; transform:translateY(14px) scale(.96)} to{opacity:1; transform:none}}
.sheet h2{
  font-family:"Bagel Fat One", Nunito, cursive; font-weight:400; font-size:20px; margin:0 0 3px;
}
.sheet .sub{font-size:11.5px; color:var(--ink-2); margin:0 0 10px}
.pickgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:11px}
.sheet .btn{
  width:100%; border:none; background:var(--pop); color:#FFFFFF; font-family:inherit;
  font-weight:900; font-size:13.5px; padding:10px; border-radius:11px; cursor:pointer;
}
.sheet .btn.ghost{background:var(--sunk); color:var(--ink); border:2px solid var(--line)}
.sheet .row{display:flex; gap:7px; margin-top:7px}

.rule-row{display:flex; align-items:center; gap:9px; margin-bottom:10px}
.rule-row .mini{
  width:32px; height:32px; border-radius:50%; display:grid; place-items:center; flex:none;
  color:#FFFFFF; font-size:17px; font-weight:900;
}
.mini.keep{background:var(--keep)} .mini.done{background:var(--done)} .mini.no{background:var(--no)}
.rule-row p{margin:0; font-size:12px; line-height:1.35}
.sheet .tip{font-size:11.5px; color:var(--ink-2); line-height:1.45; margin:10px 0 0}

/* the box reveal */
.reveal{text-align:center}
.reveal .big{width:120px; margin:4px auto 10px}
.reveal .big .pic{aspect-ratio:1; border-radius:14px; animation:burst .45s cubic-bezier(.2,1.6,.4,1) both}
.reveal .big .pic .glyph{font-size:58px}
@keyframes burst{from{transform:scale(.2) rotate(-14deg); opacity:0} to{transform:none; opacity:1}}
.reveal .verdict{font-size:13px; font-weight:900; margin:0 0 3px; line-height:1.3}
.reveal .stars{font-size:15px; font-weight:900; letter-spacing:.1em; margin:0 0 10px}

/* ---------- robot opponent ---------- */
.panel.robot{flex:none}
.hand{
  display:flex; gap:4px; height:36px; overflow:hidden; align-items:stretch;
  padding:0; margin:0; flex:none;
}
.back{
  width:27px; border-radius:6px; border:2px solid var(--line); flex:none;
  display:grid; place-items:center; font-size:12px; font-weight:900; color:var(--ink-2);
  background:var(--sunk);
  background-image:repeating-linear-gradient(45deg, var(--line) 0 3px, transparent 3px 7px);
}
.back.more{width:auto; padding:0 7px; font-size:9.5px; letter-spacing:.04em; background-image:none}

.act.botpress .dot{animation:botpress .5s ease-out}
@keyframes botpress{
  0%{transform:scale(1)}
  30%{transform:scale(1.3); box-shadow:0 0 0 8px rgba(122,59,224,.35)}
  100%{transform:scale(1)}
}
.robot .acts{pointer-events:none}
.robot .card{cursor:default}
.robot .who{opacity:.85}
.thinking{
  display:inline-block; margin-left:5px; font-size:9px; font-weight:900;
  color:var(--pop); letter-spacing:.06em; text-transform:uppercase;
}
.thinking[hidden]{display:none}
.thinking i{font-style:normal; animation:blink 1.1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}
.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

@media (max-height:700px){
  .dot{width:39px; height:39px; font-size:20px}
  .act .lbl{font-size:7.5px; line-height:1.1}
  .act .lbl br{display:none}
  .slots{height:76px; grid-auto-columns:54px}
  .pic .glyph{font-size:21px}
  .card .nm{font-size:8.5px}
  .bin{font-size:9px; padding:2px 7px 2px 5px}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="app">
  <div class="bar">
    <h1 class="logo">Whatsit Swap</h1>
    <span class="spacer"></span>
    <button class="icon-btn" id="opp" title="Play against the robot" aria-label="Switch opponent">&#128101;</button>
    <button class="icon-btn" id="hlp" title="How to play" aria-label="How to play">?</button>
    <button class="icon-btn" id="snd" title="Sound on or off" aria-label="Sound on or off">&#128266;</button>
    <button class="icon-btn" id="rst" title="Start over with new stuff" aria-label="Start over with new stuff">&#8635;</button>
  </div>

  <section class="panel">
    <div class="phead">
      <button class="avatar" id="av1" title="Tap to change" aria-label="Change top trader's picture">&#129412;</button>
      <input class="who" id="nm1" value="Bee" maxlength="9" aria-label="Top trader name">
      <span class="thinking" id="think" hidden>thinking<i>.</i><i>.</i><i>.</i></span>
      <span class="spacer"></span>
      <span class="count" id="ct1"></span>
    </div>
    <div class="bins" id="bins1"></div>
    <div class="stash" id="st1"></div>
  </section>

  <section class="table" id="table">
    <div class="acts">
      <button class="act keep" data-keep="1"><span class="dot">&#43;</span><span class="lbl">Keep <br>playing</span></button>
      <button class="act done" data-done="1" aria-pressed="false"><span class="dot">&#10003;</span><span class="lbl">Yes, <br>finish</span></button>

<!-- one sheet, many jobs -->
<div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/* =======================================================================
   BINS - tap a bin, pick a thing. This replaced the old Find stuff button.
   ======================================================================= */
var BINS = [
  {
    key:"cursed", title:"Cursed Things", icon:"👻", chip:"Cursed",
    adj:["Cursed","Slightly Haunted","Politely Cursed","Screaming","Whispering","Possessed","Doomed","Definitely Not Haunted","Wailing","Unblinking"],
    nouns:[["Teapot","🫖"],["Doll","🪆"],["Mirror","🪞"],["Candle","🕯️"],["Music Box","🎵"],["Key","🗝️"],["Painting","🖼️"],["Crown","👑"],["Skull","💀"],["Ring","💍"],["Clock","🕰️"],["Mask","🎭"]],
    quirks:["Hums when nobody is looking.","Definitely not haunted. Probably.","Screams politely when dropped.","Refuses to be photographed.","Has a tiny door on the back.","Ticks, but is not a clock.","Once won an argument.","Watches you leave the room."]
  },
  {
    key:"squishy", title:"Squishy Things", icon:"🫧", chip:"Squishy",
    adj:["Extremely Squishy","Rubbery","Bouncy","Squelchy","Jiggly","Wobbly","Overly Soft","Slightly Inflated"],
    nouns:[["Rubber Duck","🦆"],["Jellyfish","🪼"],["Pillow","🛏️"],["Marshmallow","🍡"],["Sponge","🧽"],["Balloon","🎈"],["Bouncy Ball","🏐"],["Gummy Worm","🪱"],["Stress Ball","🧶"],["Blob","🟢"]],
    quirks:["Makes a boing noise. Always.","Weighs exactly one hamster.","Cannot be folded. Do not try.","Comes with a very small friend.","Purrs if you are nice to it.","Slightly bigger on the inside.","Bounces higher on Tuesdays."]
  },
  {
    key:"shiny", title:"Shiny Things", icon:"✨", chip:"Shiny",
    adj:["Extremely Shiny","Glow-in-the-Dark","Sparkling","Blindingly Bright","Freshly Polished","World-Famous","Award-Winning"],
    nouns:[["Crystal","💎"],["Trophy","🏆"],["Gold Coin","🪙"],["Star Sticker","⭐"],["Disco Ball","🪩"],["Medal","🥇"],["Lightbulb","💡"],["Ring","💍"],["Glitter Jar","🫙"],["Tiara","👑"]],
    quirks:["Glows a bit in the dark.","Belonged to a famous goose.","Voted Most Likely To Roll Away.","Was a birthday present. Twice.","Blinds one person per week.","Smells like a new notebook."]
  },
  {
    key:"gross", title:"Gross Things", icon:"🤢", chip:"Gross",
    adj:["Terrible","Suspiciously Damp","Slightly Soggy","Half-Melted","Extra Crunchy","Sticky","Mysteriously Warm","Deeply Unpleasant"],
    nouns:[["Sock","🧦"],["Tooth","🦷"],["Pickle","🥒"],["Old Sandwich","🥪"],["Mushroom","🍄"],["Slug","🐌"],["Banana Peel","🍌"],["Boot","🥾"],["Wig","💇"],["Chewed Gum","🫧"]],
    quirks:["Smells faintly of Tuesday.","Found at the bottom of a lake.","Survived three washing machines.","Legally counts as a snack.","Has opinions about soup.","Came free with a sandwich.","Nobody knows what it does."]
  },
  {
    key:"ancient", title:"Ancient Things", icon:"🏺", chip:"Ancient",
    adj:["Ancient","Very Old","Dusty","Museum-Worthy","Older Than Time","Crumbly","Freshly Dug Up"],
    nouns:[["Vase","🏺"],["Scroll","📜"],["Compass","🧭"],["Old Coin","🪙"],["Bone","🦴"],["Map","🗺️"],["Lantern","🏮"],["Sword","🗡️"],["Book","📕"],["Pocket Watch","⌚"]],
    quirks:["Older than your grandma's grandma.","Was once a hat.","Nobody knows what it does.","Has survived several kingdoms.","Found in somebody's attic.","Smells like a very old library."]
  },
  {
    key:"box", title:"Boxes", icon:"📦", chip:"Boxes",
    adj:["Brand New","Sealed","Genuine","Official","Untouched","Factory-Fresh"],
    nouns:[["iPhone Box","📱"],["Gift Box","🎁"],["Treasure Chest","🧰"],["Pizza Box","🍕"],["Cereal Box","🥣"],["Shoe Box","👟"],["Lunch Box","🍱"],["Fancy Bag","🛍️"]],
    quirks:["Looks incredibly valuable.","Definitely worth five stars.","Trust me. It's amazing.","You are going to love this.","Absolutely nothing suspicious here."]
  }
];
var BINMAP = {};
BINS.forEach(function(b){ BINMAP[b.key] = b; });

var RARITY = [["common",55],["rare",25],["epic",13],["legendary",5],["one-of-a-kind",2]];
var PIPS = {"common":"★","rare":"★★","epic":"★★★","legendary":"★★★★","one-of-a-kind":"★★★★★"};
var AVS = ["🦊","🦄","🦖","🐰","🐸","🐙","🐼","🐝"];

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rollRarity(){
  var n = Math.random()*100, acc = 0;
  for (var i=0;i<RARITY.length;i++){ acc += RARITY[i][1]; if (n < acc) return RARITY[i][0]; }
  return "common";
}
var serial = 1;
function makeThing(binKey){
  var b = BINMAP[binKey] || pick(BINS);
  var n = pick(b.nouns);
  var isBox = b.key === "box";
  return {
    id: "t" + serial + "-" + Math.random().toString(36).slice(2,7),
    sn: String(serial++).padStart(4,"0"),
    bin: b.key,
    label: pick(b.adj) + " " + n[0],
    emo: n[1],
    quirk: pick(b.quirks),
    /* every box advertises five stars. that is the whole joke. */
    rarity: isBox ? "one-of-a-kind" : rollRarity(),
    kind: isBox ? "box" : "thing",
    contents: null
  };
}

/* ============ state ============ */
var KEY = "whatsit-swap-v2";
var S, binOpen = null, binPlayer = 0, binOffer = [], packing = null;

function fresh(){
  return {
    serial:1, sound:true, seenHelp:false, bot:false, botBurned:0, humanName:"Bee",
    p:[
      {name:"Aria", av:AVS[0], items:[], offer:[], ready:false},
      {name:"Bee",  av:AVS[1], items:[], offer:[], ready:false}
    ]
  };
}
function stock(){
  var starters = ["cursed","squishy","shiny","gross","ancient","box"];
  for (var i=0;i<2;i++){
    for (var k=0;k<5;k++) S.p[i].items.push(makeThing(pick(starters.slice(0,5))));
    S.p[i].items.push(makeThing("box"));
  }
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if (raw){
      var d = JSON.parse(raw);
      if (d && d.p && d.p.length === 2 && d.p[0].items && d.p[1].items){
        S = d; serial = d.serial || 1;
        for (var i=0;i<2;i++){ S.p[i].offer = S.p[i].offer || []; }
        return;
      }
    }
  }catch(e){}
  S = fresh(); stock();
}
function save(){
  try{ S.serial = serial; localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ============ sound ============ */
var ac = null;
function beep(freq, dur, type){
  if (!S.sound) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = ac || new AC();
    if (ac.state === "suspended") ac.resume();
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.13, ac.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur + 0.02);
  }catch(e){}
}
function sTap(){ beep(520,.09); }
function sBack(){ beep(330,.09); }
function sKeep(){ beep(430,.1); setTimeout(function(){ beep(560,.13); },80); }
function sYes(){ beep(760,.12); }
function sTrade(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ beep(f,.17); }, i*95); }); }
function sFind(){ [660,880].forEach(function(f,i){ setTimeout(function(){ beep(f,.1); }, i*70); }); }
function sSeal(){ beep(240,.16,"square"); }
function sOpen(){ [880,660,440,330].forEach(function(f,i){ setTimeout(function(){ beep(f,.14); }, i*80); }); }

/* ============ pictures ============ */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
var SQUIG = '<svg class="d" viewBox="0 0 100 100">'
  + '<path d="M4,32 q5,-8 10,0 t10,0"/><path d="M4,64 q5,-8 10,0 t10,0"/>'
  + '<path d="M76,32 q5,-8 10,0 t10,0"/><path d="M76,64 q5,-8 10,0 t10,0"/></svg>';
var DRIPS = '<svg class="d" viewBox="0 0 100 100">'
  + '<path d="M32,74 v10"/><path d="M50,80 v10"/><path d="M68,74 v10"/></svg>';
var WEB = '<svg class="d" viewBox="0 0 100 100">'
  + '<path d="M0,0 L34,0 M0,0 L0,34 M0,0 L26,26"/>'
  + '<path d="M10,0 A10,10 0 0 1 0,10"/><path d="M20,0 A20,20 0 0 1 0,20"/><path d="M30,0 A30,30 0 0 1 0,30"/></svg>';
var SPARKS = '<i class="spark">&#10022;</i><i class="spark">&#10022;</i><i class="spark">&#10022;</i>';

function picHTML(it){
  var deco = it.kind === "box" ? "box" : it.bin;
  var inner = '<span class="glyph">' + esc(it.emo) + '</span>';
  if (deco === "cursed") inner += SQUIG;
  else if (deco === "gross") inner += DRIPS;
  else if (deco === "ancient") inner += WEB;
  else if (deco === "shiny") inner += SPARKS;
  else if (deco === "box"){
    inner += '<i class="tape"></i><i class="tape v"></i>';
    if (it.contents) inner += '<i class="seal">&#128274;</i>';
  }
  return '<span class="pic ' + deco + '">' + inner + '</span>';
}

/* where: "stash" | "offer" | "pick" | "stuff" */
function cardHTML(it, where, extra){
  var badge = "";
  if (where === "stash" && it.kind === "box"){
    badge = it.contents
      ? '<button class="badge open" data-open="' + esc(it.id) + '" title="Open the box" aria-label="Open the box">&#128275;</button>'
      : '<button class="badge pack" data-pack="' + esc(it.id) + '" title="Put something inside" aria-label="Put something inside">&#43;</button>';
  }
  var attr = extra || ('data-id="' + esc(it.id) + '" data-where="' + where + '"');
  var showQuirk = (where === "pick");
  return '<div class="cardwrap">'
    + '<button class="card" data-r="' + esc(it.rarity) + '" ' + attr + '>'
    + picHTML(it)
    + '<span class="nm">' + esc(it.label) + '</span>'
    + (showQuirk ? '<span class="qk">' + esc(it.quirk) + '</span>' : '')
    + '<span class="pips">' + PIPS[it.rarity] + '</span>'
    + (where === "stash" ? '<span class="sn">#' + esc(it.sn) + '</span>' : '')
    + '</button>' + badge + '</div>';
}

/* ============ render ============ */
var statusEl = $("status");

function renderBins(){
  for (var i=0;i<2;i++){
    $("bins"+i).innerHTML = BINS.map(function(b){
      return '<button class="bin" data-bin="' + b.key + '" data-player="' + i + '" title="' + b.title + '">'
        + '<span class="bemo">' + b.icon + '</span>' + b.chip + '</button>';
    }).join("");
  }
}

function render(){
  var nothingDown = (S.p[0].offer.length === 0 && S.p[1].offer.length === 0);
  for (var i=0;i<2;i++){
    var p = S.p[i];
    if ($("nm"+i) !== document.activeElement) $("nm"+i).value = p.name;
    $("av"+i).textContent = p.av;
    $("ct"+i).textContent = p.items.length + " thing" + (p.items.length === 1 ? "" : "s");
    if (S.bot && i === 1){
      /* she does not get to see what the robot is holding */
      var shown = Math.min(p.items.length, 7);
      var backs = "";
      for (var bk=0; bk<shown; bk++) backs += '<span class="back">?</span>';
      if (p.items.length > shown) backs += '<span class="back more">+' + (p.items.length - shown) + '</span>';
      $("st"+i).className = "hand";
      $("st"+i).innerHTML = backs || '<span class="back more">empty</span>';
    } else {
      $("st"+i).className = "stash";
      $("st"+i).innerHTML = p.items.length
        ? p.items.map(function(it){ return cardHTML(it,"stash"); }).join("")
        : '<p class="empty">Nothing yet &mdash; tap a bin up there.</p>';
    }

    var slots = $("of"+i);
    slots.classList.toggle("wide", p.offer.length === 0);
    slots.innerHTML = p.offer.length
      ? p.offer.map(function(it){ return cardHTML(it,"offer"); }).join("")
      : '<p class="empty">' + esc(p.name) + ' has not put anything down.</p>';

    var db = document.querySelector('[data-done="' + i + '"]');
    db.setAttribute("aria-pressed", p.ready ? "true" : "false");
    db.querySelector(".lbl").innerHTML = p.ready ? "Happy!" : "Yes, <br>finish";
    db.disabled = nothingDown;
    document.querySelector('[data-cancel="' + i + '"]').disabled = nothingDown;
  }
  $("snd").textContent = S.sound ? "🔊" : "🔇";
  $("opp").textContent = S.bot ? "🤖" : "👥";
  $("opp").title = S.bot ? "Robot opponent - tap for two players" : "Two players - tap to play the robot";
  document.querySelectorAll(".panel")[0].classList.toggle("robot", S.bot);
  $("bins1").hidden = S.bot;
  $("nm1").disabled = S.bot;
  save();
}

function say(msg, cls){
  statusEl.textContent = msg;
  statusEl.className = "status " + (cls || "");
  if (cls === "stop"){
    statusEl.classList.remove("shake"); void statusEl.offsetWidth; statusEl.classList.add("shake");
  }
}
function unready(){ S.p[0].ready = false; S.p[1].ready = false; }
function findItem(id){
  for (var i=0;i<2;i++){
    for (var k=0;k<S.p[i].items.length;k++) if (S.p[i].items[k].id === id) return {p:i, k:k, it:S.p[i].items[k]};
  }
  return null;
}
function article(w){ return /^[AEIOU]/.test(w) ? "an " : "a "; }

/* ============ sheets ============ */
function openSheet(html){ $("sheet").innerHTML = html; $("veil").hidden = false; }
function closeSheet(){ $("veil").hidden = true; binOpen = null; packing = null; }

function showBin(key, player){
  binOpen = key; binPlayer = player;
  var b = BINMAP[key];
  binOffer = []; for (var i=0;i<6;i++) binOffer.push(makeThing(key));
  drawBin();
  sFind();
}
function drawBin(){
  var b = BINMAP[binOpen];
  openSheet(
    '<h2>' + b.icon + ' ' + b.title + '</h2>'
    + '<p class="sub">Tap something to give it to <b>' + esc(S.p[binPlayer].name) + '</b>.</p>'
    + '<div class="pickgrid">'
    + binOffer.map(function(it,i){ return cardHTML(it,"pick",'data-take="' + i + '"'); }).join("")
    + '</div>'
    + '<div class="row">'
    + '<button class="btn ghost" id="binShuffle">&#127922; Different stuff</button>'
    + '<button class="btn" id="sheetDone">Done</button></div>'
  );
}

function showPack(boxId){
  var f = findItem(boxId); if (!f) return;
  packing = {boxId:boxId, player:f.p};
  var mine = S.p[f.p].items.filter(function(x){ return x.kind !== "box"; });
  openSheet(
    '<h2>&#128230; What goes in the box?</h2>'
    + '<p class="sub">Nobody can see inside once it is shut. The box still says '
    + '<b>&#9733;&#9733;&#9733;&#9733;&#9733;</b> on the outside.</p>'
    + (mine.length
        ? '<div class="pickgrid">' + mine.map(function(it){ return cardHTML(it,"pick",'data-stuff="' + esc(it.id) + '"'); }).join("") + '</div>'
        : '<p class="sub">You have nothing to put in it yet. Go grab something from a bin.</p>')
    + '<button class="btn ghost" id="sheetDone">Leave it empty</button>'
  );
}

function showReveal(it, opener, boxLabel){
  var inside = it.contents;
  var body;
  if (inside){
    body = '<div class="big">' + picHTML(inside) + '</div>'
      + '<p class="verdict">' + esc(opener) + ' opened the ' + esc(boxLabel) + '...<br>it was '
      + article(inside.label) + '<b>' + esc(inside.label) + '</b>!</p>'
      + '<p class="stars" style="color:var(--r-' + (inside.rarity === "one-of-a-kind" ? "oneof" : inside.rarity.slice(0,6)) + ')">'
      + PIPS[inside.rarity] + '</p>';
  } else {
    body = '<div class="big"><span class="pic box"><span class="glyph">&#128229;</span></span></div>'
      + '<p class="verdict">' + esc(opener) + ' opened the ' + esc(boxLabel) + '...<br>completely empty.</p>'
      + '<p class="stars" style="color:var(--ink-2)">Classic.</p>';
  }
  openSheet('<div class="reveal">' + body + '<button class="btn" id="sheetDone">Ha!</button></div>');
}

/* ============ actions ============ */
function moveCard(id, where){
  for (var i=0;i<2;i++){
    var p = S.p[i];
    var from = (where === "stash") ? p.items : p.offer;
    var to   = (where === "stash") ? p.offer : p.items;
    for (var k=0;k<from.length;k++){
      if (from[k].id === id){
        to.push(from.splice(k,1)[0]);
        unready();
        if (where === "stash"){ sTap(); say(p.name + " put something on the table."); }
        else { sBack(); say(p.name + " took something back."); }
        render();
        return;
      }
    }
  }
}

function tryTrade(){
  if (!S.p[0].ready || !S.p[1].ready) return false;
  var a = S.p[0], b = S.p[1];
  var n = a.offer.length + b.offer.length;
  var boxes = a.offer.concat(b.offer).filter(function(x){ return x.kind === "box" && x.contents; }).length;
  a.items = a.items.concat(b.offer);
  b.items = b.items.concat(a.offer);
  a.offer = []; b.offer = []; unready();
  render(); sTrade(); confetti();
  var t = $("table"); t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash");
  say("🤝 Traded! " + n + " thing" + (n === 1 ? "" : "s") + " swapped."
      + (boxes ? " Somebody got a box... better open it. 👀" : " Check your stash!"), "done");
  return true;
}

document.addEventListener("click", function(e){
  /* ---- sheets ---- */
  if (e.target.closest("#sheetDone") || e.target.id === "veil"){ closeSheet(); sTap(); return; }
  if (e.target.closest("#binShuffle")){
    binOffer = []; for (var q=0;q<6;q++) binOffer.push(makeThing(binOpen));
    drawBin(); sFind(); return;
  }
  var take = e.target.closest("[data-take]");
  if (take){
    var ti = +take.getAttribute("data-take"), got = binOffer[ti];
    S.p[binPlayer].items.push(got);
    binOffer[ti] = makeThing(binOpen);
    drawBin(); render(); sFind();
    say("✨ " + S.p[binPlayer].name + " got " + article(got.label) + got.label + "!");
    return;
  }
  var stuff = e.target.closest("[data-stuff]");
  if (stuff && packing){
    var sid = stuff.getAttribute("data-stuff");
    var fi = findItem(sid), box = findItem(packing.boxId);
    if (fi && box){
      box.it.contents = S.p[fi.p].items.splice(fi.k,1)[0];
      box.it.packedBy = box.p;
      closeSheet(); render(); sSeal();
      say("🤫 " + S.p[box.p].name + " sealed something inside the " + box.it.label + ".");
    }
    return;
  }
  var packBtn = e.target.closest("[data-pack]");
  if (packBtn){ showPack(packBtn.getAttribute("data-pack")); sTap(); return; }

  var openBtn = e.target.closest("[data-open]");
  if (openBtn){
    var of = findItem(openBtn.getAttribute("data-open"));
    if (of){
      var inside = of.it.contents, boxLabel = of.it.label;
      of.it.contents = null;
      if (inside) S.p[of.p].items.push(inside);
      render(); sOpen();
      showReveal({contents:inside}, S.p[of.p].name, boxLabel);
      if (inside) confetti();
      say(inside
        ? "😱 " + S.p[of.p].name + " opened the " + boxLabel + " - it was " + article(inside.label) + inside.label + "! " + PIPS[inside.rarity]
        : "📭 " + S.p[of.p].name + " opened the " + boxLabel + " - empty. Classic.", "stop");
    }
    return;
  }

  var binBtn = e.target.closest("[data-bin]");
  if (binBtn){ showBin(binBtn.getAttribute("data-bin"), +binBtn.getAttribute("data-player")); return; }

  if (e.target.closest("#hlp")){ showHelp(); return; }

  /* ---- the table ---- */
  var card = e.target.closest(".card");
  if (card && card.hasAttribute("data-where")){
    /* hands off the robot's stuff */
    if (S.bot && !botActing && card.closest("#st1, #of1")) {
      say("That's Robo's stuff. Hands off!", "stop"); return;
    }
    moveCard(card.getAttribute("data-id"), card.getAttribute("data-where")); return;
  }

  /* blue plus - keep playing */
  var keep = e.target.closest("[data-keep]");
  if (keep){
    var gi = +keep.getAttribute("data-keep");
    if (S.bot && gi === 0) botAskedMore = true;
    unready(); render(); sKeep();
    say("➕ " + S.p[gi].name + " wants to keep playing. Put more stuff down, " + S.p[1-gi].name + "!", "keep");
    return;
  }

  /* green check - yes, finish */
  var done = e.target.closest("[data-done]");
  if (done){
    var ri = +done.getAttribute("data-done"), p = S.p[ri];
    p.ready = !p.ready;
    render();
    if (!p.ready){ sBack(); say(p.name + " is not finished after all."); return; }
    sYes();
    if (!tryTrade()) say("💚 " + p.name + " is ready to finish. Waiting on " + S.p[1-ri].name + "...", "done");
    return;
  }

  /* red X - cancel the whole trade */
  var cxb = e.target.closest("[data-cancel]");
  if (cxb){
    var ci = +cxb.getAttribute("data-cancel");
    for (var i=0;i<2;i++){ S.p[i].items = S.p[i].items.concat(S.p[i].offer); S.p[i].offer = []; }
    unready(); render(); sBack();
    say("❌ " + S.p[ci].name + " cancelled the trade. Everybody got their stuff back.", "stop");
    return;
  }

  if (e.target.closest("#snd")){ S.sound = !S.sound; render(); if (S.sound) sTap(); return; }

  if (e.target.closest("#opp")){
    /* everything on the table goes home before the opponent changes */
    for (var z=0;z<2;z++){ S.p[z].items = S.p[z].items.concat(S.p[z].offer); S.p[z].offer = []; }
    unready(); botNags = 0; clearTimeout(botTimer); $("think").hidden = true;
    S.bot = !S.bot;
    if (S.bot){
      S.humanName = S.p[1].name === "Robo" ? (S.humanName || "Bee") : S.p[1].name;
      S.p[1].name = "Robo"; S.p[1].av = "🤖";
      render(); sYes();
      say("🤖 Robo wants to trade. Good luck.", "keep");
      scheduleBot(1200);
    } else {
      S.p[1].name = S.humanName || "Bee";
      S.p[1].av = AVS[1];
      render(); sTap();
      say("Two players again. Pass the phone.");
    }
    return;
  }

  if (e.target.closest("#rst")){
    if (!confirm("Start over? Everybody gets brand new stuff.")) return;
    var names = [S.p[0].name, S.p[1].name], seen = S.seenHelp;
    S = fresh(); serial = 1; S.seenHelp = seen;
    S.p[0].name = names[0]; S.p[1].name = names[1];
    S.p[0].av = pick(AVS);
    S.p[1].av = pick(AVS.filter(function(a){ return a !== S.p[0].av; }));
    stock(); render(); sFind();
    say("Brand new stuff for everybody. Start trading!");
    return;
  }

  var av = e.target.closest(".avatar");
  if (av){
    var ai = +av.id.slice(2);
    S.p[ai].av = AVS[(AVS.indexOf(S.p[ai].av) + 1) % AVS.length];
    render(); sTap();
  }
});

function showHelp(){
  openSheet(
    '<h2>How to play</h2>'
    + '<div class="rule-row"><span class="mini keep">&#43;</span>'
    + '<p><b>Keep playing</b><br>Not enough yet &mdash; the other trader should put more stuff down.</p></div>'
    + '<div class="rule-row"><span class="mini done">&#10003;</span>'
    + '<p><b>Yes, finish</b><br>I am happy! When <em>both</em> traders tap green, the stuff swaps.</p></div>'
    + '<div class="rule-row"><span class="mini no">&#10007;</span>'
    + '<p><b>Cancel trade</b><br>Call the whole thing off. Everybody gets their stuff back.</p></div>'
    + '<p class="tip"><b>Finding stuff:</b> tap a bin &mdash; Cursed, Squishy, Shiny, Gross, Ancient, Boxes &mdash; '
    + 'then tap the thing you want.<br><br>'
    + '<b>&#128230; Boxes are sneaky.</b> Every box says &#9733;&#9733;&#9733;&#9733;&#9733; on the outside. '
    + 'Tap the little <b>+</b> on a box in your stash to hide something inside it, then trade the box. '
    + 'Whoever gets it taps the <b>&#128275;</b> to open it &mdash; and finds out what is <em>really</em> in there.<br><br>'
    + '<b>&#129302; Playing alone?</b> Tap the people button at the top to swap the other trader '
    + 'for Robo. Robo believes what a box says on the outside &mdash; the first few times.<br><br>'
    + 'Tap the animal or the name to change who is playing.</p>'
    + '<button class="btn" id="sheetDone">Got it!</button>'
  );
  S.seenHelp = true; save();
}

for (var i=0;i<2;i++){
  (function(i){
    $("nm"+i).addEventListener("input", function(e){
      S.p[i].name = e.target.value.trim() || (i ? "Trader 2" : "Trader 1");
      save();
    });
    $("nm"+i).addEventListener("blur", render);
  })(i);
}

/* =======================================================================
   THE ROBOT
   Plays the top seat when it is switched on. It values a pile by stars,
   and it values a SEALED BOX at the five stars printed on the outside -
   until it gets burned, and then it starts discounting them.
   ======================================================================= */
var botTimer = null, botActing = false, botNags = 0, botAskedMore = false;

function starVal(it){
  if (it.kind === "box"){
    var b = S.botBurned || 0;
    return b >= 3 ? 0.5 : (b === 2 ? 1.5 : (b === 1 ? 3 : 5));
  }
  return PIPS[it.rarity].length;
}
function pileVal(a){ var t = 0; for (var i=0;i<a.length;i++) t += starVal(a[i]); return t; }

function scheduleBot(ms){
  if (!S.bot){ $("think").hidden = true; return; }
  clearTimeout(botTimer);
  $("think").hidden = false;
  botTimer = setTimeout(function(){ $("think").hidden = true; botAct(); }, ms || (900 + Math.random()*800));
}
function botSay(msg, cls){ say("🤖 " + msg, cls); }
function botPress(kind){
  var el = document.querySelector('[data-' + kind + '="1"]');
  if (!el) return;
  el.classList.remove("botpress"); void el.offsetWidth; el.classList.add("botpress");
}
function botAct(){
  if (!S.bot || botActing) return;
  botActing = true;
  try { botBrain(); } catch(err){ } finally { botActing = false; }
}

function botBrain(){
  var me = S.p[1], you = S.p[0];

  /* 1. did somebody hand it a sealed box? open it. */
  var handed = me.items.filter(function(x){ return x.kind === "box" && x.contents && x.packedBy !== 1; });
  if (handed.length){
    var bx = handed[0], inside = bx.contents;
    bx.contents = null; bx.packedBy = null;
    me.items.push(inside);
    var worth = PIPS[inside.rarity].length;
    if (worth <= 2){
      S.botBurned = (S.botBurned || 0) + 1;
      render(); sOpen();
      botSay("Robo opened the " + bx.label + " ... " + article(inside.label) + inside.label
        + " " + PIPS[inside.rarity] + ". Robo will remember this.", "stop");
    } else {
      render(); sOpen(); confetti();
      botSay("Robo opened the " + bx.label + " ... " + article(inside.label) + inside.label
        + " " + PIPS[inside.rarity] + ". Robo is delighted.", "done");
    }
    scheduleBot(1600);
    return;
  }

  /* 2. keep a stash worth trading from */
  if (me.items.length < 4){
    var bin = pick(BINS).key;
    me.items.push(makeThing(bin));
    render(); sFind();
    botSay("Robo went digging in " + BINMAP[bin].title + ".");
    scheduleBot(700);
    return;
  }

  /* 3. nothing on the table - wait for a human to start it */
  if (you.offer.length === 0 && me.offer.length === 0){ botNags = 0; return; }
  if (you.offer.length === 0) return;               /* it has offered, ball is in her court */

  var mine = pileVal(me.offer), hers = pileVal(you.offer);
  var gap = hers - mine;

  /* 3b. she tapped the blue plus - that is a direct ask for more */
  if (botAskedMore){
    botAskedMore = false;
    if (mine <= hers + 1.5 && me.items.length){
      var extra = me.items.slice().sort(function(a,b){ return starVal(a) - starVal(b); })[0];
      me.offer.push(me.items.splice(me.items.indexOf(extra),1)[0]);
      unready(); render(); sTap();
      botSay("Fine. Robo adds one more thing.");
      scheduleBot(1200);
      return;
    }
    botNags++;
    if (botNags >= 3){
      for (var q=0;q<2;q++){ S.p[q].items = S.p[q].items.concat(S.p[q].offer); S.p[q].offer = []; }
      unready(); botNags = 0; render(); botPress("cancel"); sBack();
      botSay("Robo is done being asked. Robo is out.", "stop");
      return;
    }
    unready(); render(); botPress("keep"); sKeep();
    botSay("Robo has already given you plenty.", "keep");
    return;
  }

  /* 4. it always puts something down, and tops up when it is getting the better deal */
  if (me.items.length && (me.offer.length === 0 || gap > 1.2)){
    /* sometimes it pulls the box trick itself */
    var junk = me.items.filter(function(x){ return x.kind !== "box" && PIPS[x.rarity].length <= 2; });
    var emptyBox = me.items.filter(function(x){ return x.kind === "box" && !x.contents; });
    if (emptyBox.length && junk.length && Math.random() < 0.35){
      emptyBox[0].contents = junk[0];
      emptyBox[0].packedBy = 1;
      me.items.splice(me.items.indexOf(junk[0]), 1);
      render(); sSeal();
      botSay("Robo put something in a box. Robo looks innocent.");
      scheduleBot(1100);
      return;
    }
    /* otherwise the best thing it owns that still fits under the gap */
    var fits = me.items.filter(function(x){ return starVal(x) <= gap + 0.5; });
    var give = fits.length
      ? fits.sort(function(a,b){ return starVal(b) - starVal(a); })[0]
      : me.items.slice().sort(function(a,b){ return starVal(a) - starVal(b); })[0];
    me.offer.push(me.items.splice(me.items.indexOf(give),1)[0]);
    unready(); render(); sTap();
    botSay("Robo put something down.");
    scheduleBot(1000);
    return;
  }

  /* 5. roughly even - take the deal */
  if (gap >= -0.6){
    botNags = 0;
    me.ready = true;
    render(); botPress("done"); sYes();
    if (!tryTrade()) botSay("Robo is happy with that. Your move.", "done");
    else scheduleBot(1500);
    return;
  }

  /* 6. it is losing on the deal - ask for more, and give up after three */
  botNags++;
  if (botNags >= 3){
    for (var i=0;i<2;i++){ S.p[i].items = S.p[i].items.concat(S.p[i].offer); S.p[i].offer = []; }
    unready(); botNags = 0; render(); botPress("cancel"); sBack();
    botSay("Robo does not like this trade. Robo is out.", "stop");
    return;
  }
  unready(); render(); botPress("keep"); sKeep();
  botSay(pick([
    "Robo wants more than that.",
    "That is not enough for Robo.",
    "Robo has done the maths. Add something."
  ]), "keep");
}

/* after anything the human does, let the robot have a think */
document.addEventListener("click", function(){ if (!botActing) scheduleBot(); });

/* ============ confetti ============ */
var cv = $("fx"), ctx = cv.getContext("2d");
var bits = [], raf = 0;
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeCanvas(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
window.addEventListener("resize", sizeCanvas);
sizeCanvas();

function confetti(){
  if (reduce) return;
  var cols = ["#F0455F","#0FAF7E","#2E7BE0","#F2A81C","#7A3BE0"];
  bits = [];
  for (var i=0;i<80;i++){
    bits.push({
      x: Math.random()*cv.width, y: cv.height*0.45 + Math.random()*70,
      vx: (Math.random()-0.5)*7, vy: -7 - Math.random()*8,
      s: 5 + Math.random()*7, c: pick(cols),
      r: Math.random()*6, vr: (Math.random()-0.5)*0.35, life: 1
    });
  }
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  var alive = false;
  for (var i=0;i<bits.length;i++){
    var b = bits[i];
    b.vy += 0.32; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= 0.009;
    if (b.life > 0 && b.y < cv.height + 30){
      alive = true;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.globalAlpha = Math.max(0, b.life); ctx.fillStyle = b.c;
      ctx.fillRect(-b.s/2, -b.s/2, b.s, b.s*0.62);
      ctx.restore();
    }
  }
  if (alive){ raf = requestAnimationFrame(tick); }
  else { ctx.clearRect(0,0,cv.width,cv.height); raf = 0; }
}

load();
renderBins();
render();
if (S.bot) scheduleBot(1400);
if (!S.seenHelp) showHelp();
</script>
